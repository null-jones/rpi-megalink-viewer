name: Release

# What a release carries: the SD card image, Raspberry Pi OS Lite with the
# display already installed, and the printable setup guide. Built for every
# v* tag and attached to its release, so setting up a display is writing a card
# with Raspberry Pi Imager and following the guide. It can also be run by hand
# from the Actions tab, which leaves both as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # arm64, so pi-gen builds natively rather than under qemu: minutes rather
    # than hours.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # uv builds the wheel the image installs.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The runner is not short of disk, but an image build uses a lot of it:
      # the root filesystem, the image, and the image again compressed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the image
        run: image/build.sh

      - name: Check the image
        run: sudo image/check.sh dist/image/*.img.xz

      # Booted, with no network, to see the hotspot fallback start and count
      # down. Its files once all passed the check above while systemd dropped
      # it from every boot, which only booting shows.
      - name: Boot the image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends systemd-container
          sudo image/boot-test.sh dist/image/*.img.xz

      - uses: actions/upload-artifact@v4
        with:
          name: megalink-display-image
          path: dist/image/
          # Already xz; zipping it again only costs time.
          compression-level: 0
          retention-days: 14

  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The same Debian the guide is built in by hand, with its WeasyPrint.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-markdown weasyprint \
            fonts-dejavu-core fonts-inter

      - name: Build the guide
        run: python3 docs/guide/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: megalink-viewer-guide
          path: dist/megalink-viewer-guide-*.pdf
          retention-days: 14

  release:
    # One job for the release, once both are built: two jobs each creating the
    # release if it was not there would race.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, guide]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
