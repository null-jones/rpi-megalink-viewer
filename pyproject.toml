[project]
name = "megalink-viewer"
version = "0.1.0"
description = "Lightweight per-position display for Megalink Live shooting scores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ellie Jones", email = "ellie.jones@wyvern.space" }]
keywords = ["megalink", "shooting", "scoring", "raspberry-pi", "firebase"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

# Deliberately zero runtime dependencies: the target is a Raspberry Pi Zero 2 W,
# where every wheel that needs compiling is a liability. Everything below is
# built on the standard library only.
dependencies = []

[project.scripts]
megalink = "megalink_viewer.cli:main"

[project.urls]
Homepage = "https://github.com/null-jones/rpi-megalink-viewer"
Repository = "https://github.com/null-jones/rpi-megalink-viewer"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megalink_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Vendored code is kept byte-for-byte as upstream publishes it, so it can be
# replaced rather than merged when upstream changes.
extend-exclude = ["src/megalink_viewer/_vendor"]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# These modules embed a complete HTML page as a string. Wrapping markup to suit
# a Python line-length rule makes it harder to read, not easier.
"src/megalink_viewer/webconfig.py" = ["E501"]
"src/megalink_viewer/fleet.py" = ["E501"]
